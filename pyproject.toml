[project]
name = "deeplearning-mcp"
version = "0.1.0"
description = "MCP server for DeepLearning.ai courses via MultiOn browser agent"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "deeplearning-mcp contributors"}]
readme = "README.md"
dependencies = [
    "mcp>=1.0.0",
    "playwright>=1.44.0",
    "browser-use>=0.1.0",
    "langchain-groq>=0.1.0",
    "aiosqlite>=0.19.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.0.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
deeplearning-mcp = "deeplearning_mcp.server:main_sync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deeplearning_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
